name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v4
        with:
          path: Mobile
      - name: Front-End (site empacotado no app)
        uses: actions/checkout@v4
        with:
          repository: Love-Journey-OFC/Front-End
          path: Front-End
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dependências do app
        run: npm ci
      - name: Sintaxe dos scripts
        run: npm run verificar
      - name: APK de debug
        run: npm run apk
      - uses: actions/upload-artifact@v4
        with:
          name: love-journey-debug-apk
          path: Mobile/android/app/build/outputs/apk/debug/app-debug.apk
